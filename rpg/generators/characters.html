 <!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Villager Generator</title>
  <link rel="stylesheet" type="text/css" media="screen" href="characters.css">
  <link rel="stylesheet" type="text/css" media="print" href="character-print.css">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC&family=Shalimar&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#e9e3cc">

</head>

<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Generating character...</p>
        </div>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="error-message hidden">
        <p class="error-text"></p>
        <button id="retry-button" class="btn-retry">Try Again</button>
    </div>

    <!-- Generate Button -->
    <div id="generate-controls">
        <button id="config-button" class="btn-config">⚙️ Configure</button>
        <label for="quantity-input" class="quantity-label">
            <span>Quantity:</span>
            <input type="number" id="quantity-input" min="1" max="100" value="1">
        </label>
        <button id="generate-button" class="btn-generate">Generate Characters</button>
    </div>

    <!-- Config Modal -->
    <div id="config-modal" class="config-modal hidden">
        <div class="config-content">
            <div class="config-header">
                <h2>Character Generation Settings</h2>
                <button id="config-close" class="config-close">&times;</button>
            </div>

            <div class="config-body">
                <div class="config-section">
                    <div class="config-section-header">
                        <h3>Races</h3>
                        <div class="config-section-actions">
                            <button id="race-select-all" class="btn-small">Select All</button>
                            <button id="race-deselect-all" class="btn-small">Deselect All</button>
                        </div>
                    </div>
                    <div id="race-checkboxes" class="checkbox-grid">
                        <!-- Race checkboxes will be injected here -->
                    </div>
                </div>

                <div class="config-section">
                    <div class="config-section-header">
                        <h3>Classes</h3>
                        <div class="config-section-actions">
                            <button id="class-select-all" class="btn-small">Select All</button>
                            <button id="class-deselect-all" class="btn-small">Deselect All</button>
                        </div>
                    </div>
                    <div id="class-checkboxes" class="checkbox-grid">
                        <!-- Class checkboxes will be injected here -->
                    </div>
                </div>
            </div>

            <div class="config-footer">
                <button id="config-save" class="btn-save">Save & Generate</button>
            </div>
        </div>
    </div>

    <div id="charsheet-container">
    </div>
  <script src="characters.js"></script>
</body>
</html>
